<script id="animation-documents" type="application/json">{"normal":{"title":"正常执行","file":"art-normal-execution-animation.html","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>一次 Java 调用如何进入 ART\u003c/title>\n\u003cstyle>\n  :root{--bg:#eef3f7;--ink:#152c40;--sub:#466071;--line:#cfdae4;--blue:#214d88;--blue-bg:#e9f1ff;--green:#08634c;--green-bg:#e8f6ef}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,\"Microsoft YaHei\",sans-serif}\n  main{max-width:1160px;margin:auto;padding:32px 24px 48px}\n  h1,h2,h3,p{margin:0}\n  h1{font-size:clamp(28px,4.8vw,46px);line-height:1.18;margin:8px 0}\n  h2{font-size:18px}\n  h3{font-size:15px}\n  code,pre{font-family:\"Cascadia Code\",Consolas,monospace}\n  code{overflow-wrap:anywhere}\n  a{color:var(--blue);text-underline-offset:3px}\n  .kicker,.lead,.hint{color:var(--sub)}\n  .kicker,.hint{font-size:13px}\n  .lead{margin-bottom:16px}\n  .board{background:#fff;border:1px solid var(--line);border-radius:12px}\n  .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line)}\n  button{font:inherit;cursor:pointer}\n  .toolbar button{min-height:38px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:4px 10px;font-size:14px}\n  .toolbar button:disabled{opacity:.55;cursor:default}\n  .toolbar #play{min-width:72px;background:var(--blue);color:white;border-color:var(--blue)}\n  button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}\n  #progress{margin-left:auto;color:var(--sub);font-size:13px}\n  .diagram{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}\n  .layers,.objects{padding:14px 16px 16px;min-width:0}\n  .layers{position:relative}\n  .objects{border-left:1px solid var(--line);background:#f8fafc}\n  .layer-list{list-style:none;margin:8px 0 0;padding:0 0 0 20px;position:relative}\n  .layer-list::before{content:'';position:absolute;left:4px;top:23px;bottom:23px;border-left:2px solid #a5b8cf}\n  .layer-list li{position:relative;margin:0 0 8px}\n  .layer-list > li:nth-last-child(2){margin:0}\n  .layer{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}\n  .layer b,.layer code{display:block}\n  .layer code{font-size:12px;color:var(--sub)}\n  .layer[aria-current=step]{background:var(--blue-bg);border-color:var(--blue)}\n  .layer-list > .token{position:absolute;left:0;top:0;margin:0;width:10px;height:10px;z-index:1;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #c9dfff;pointer-events:none}\n  .token.moving{transition:transform .55s cubic-bezier(.22,.7,.24,1)}\n  .object{border:1px solid var(--line);border-radius:6px;background:white;overflow:hidden}\n  .object h3{padding:6px 9px;background:#f1f5f9}\n  .object p,.object dl{padding:6px 9px;margin:0;font-size:13px}\n  .object dl>div+div{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}\n  .object dt{font-weight:650}\n  .object dd{margin:0;color:var(--sub)}\n  .object.live{border-color:var(--green)}\n  .object.live h3{background:var(--green-bg);color:var(--green)}\n  .objects h2{margin-bottom:8px}\n  .relation{font-size:12px;color:var(--sub);padding:2px 0 2px 12px}\n  .relation b{color:var(--green);font-size:16px}\n  .native-out{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}\n  .annotation{border-top:1px solid var(--line);padding:12px 16px;min-height:88px}\n  .annotation p{color:var(--sub);margin-top:3px}\n  footer{display:flex;gap:5px 14px;flex-wrap:wrap;margin-top:12px;font-size:13px}\n  @media(max-width:700px){main{padding:20px 12px 30px}.diagram{grid-template-columns:minmax(0,1fr)}.objects{border-left:0;border-top:1px solid var(--line)}}\n  @media(max-width:400px){#progress{margin-left:0}.native-out{grid-template-columns:minmax(0,1fr)}}\n  @media(prefers-reduced-motion:reduce){.token.moving{transition:none}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003cp class=\"kicker\">AOSP android-7.1.2_r39 · 未 Hook · 反射调用示例\u003c/p>\n  \u003ch1>一次 Java 调用如何进入 ART\u003c/h1>\n  \u003cp class=\"lead\">跟着左侧光点看调用跨过哪些层，同时看右侧的反射对象、\u003ccode>ArtMethod\u003c/code> 和代码之间如何连接。\u003c/p>\n  \u003csection class=\"board\" aria-label=\"Java 到 ART 的流程动画\">\n    \u003cdiv class=\"toolbar\">\n      \u003cbutton type=\"button\" id=\"play\">播放\u003c/button>\n      \u003cbutton type=\"button\" id=\"prev\">上一步\u003c/button>\n      \u003cbutton type=\"button\" id=\"next\">下一步\u003c/button>\n      \u003cbutton type=\"button\" id=\"reset\">重置\u003c/button>\n      \u003coutput id=\"progress\" aria-live=\"polite\">\u003c/output>\n    \u003c/div>\n    \u003cdiv class=\"diagram\">\n      \u003cdiv class=\"layers\">\n        \u003ch2>控制流\u003c/h2>\n        \u003col class=\"layer-list\">\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>应用 Java 代码\u003c/b>\u003ccode>method.invoke(gate, \"demo\")\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>Java API · Android libcore\u003c/b>\u003ccode>java.lang.reflect.Method.invoke()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>JNI 边界 · ART native 入口\u003c/b>\u003ccode>Method_invoke() → InvokeMethod()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>ART C++ · 解析反射对象\u003c/b>\u003ccode>AbstractMethod::GetArtMethod()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>ART C++ · 调用目标方法\u003c/b>\u003ccode>InvokeWithArgArray() → ArtMethod::Invoke()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>执行编译后的原方法\u003c/b>\u003ccode>quick 入口 → Gate.check()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>返回 Java 调用方\u003c/b>\u003ccode>JValue → Boolean → 调用结果\u003c/code>\u003c/button>\u003c/li>\n          \u003cli class=\"token\" aria-hidden=\"true\" hidden>\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n      \u003caside class=\"objects\" aria-label=\"对象与地址\">\n        \u003ch2>对象与地址\u003c/h2>\n        \u003cdiv class=\"object\" id=\"java-method\">\n          \u003ch3>反射对象 · \u003ccode>java.lang.reflect.Method\u003c/code>\u003c/h3>\n          \u003cp>表示 \u003ccode>Gate.check(String)\u003c/code>。跨过 JNI 时，\u003ccode>javaMethod\u003c/code> 是指向该 Java 对象的 JNI 引用。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"relation\">\u003cb>↓\u003c/b> JNI 解码为 \u003ccode>mirror::AbstractMethod\u003c/code> 视图，再读 \u003ccode>art_method_\u003c/code>\u003c/div>\n        \u003cdiv class=\"object\" id=\"art-method\">\n          \u003ch3>ART 的 native 方法结构 · \u003ccode>ArtMethod\u003c/code>\u003c/h3>\n          \u003cdl>\n            \u003cdiv>\u003cdt>\u003ccode>dex_method_index_\u003c/code>\u003c/dt>\u003cdd>声明它的 DEX 里的方法索引。\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>\u003ccode>dex_code_item_offset_\u003c/code>\u003c/dt>\u003cdd>方法字节码所在的 DEX 偏移。\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>\u003ccode>entry_point_from_quick_compiled_code_\u003c/code>\u003c/dt>\u003cdd>本例保存编译后代码的入口地址。\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/div>\n        \u003cdiv class=\"native-out\">\n          \u003cdiv id=\"dex\" class=\"object\">\u003ch3>DEX 字节码\u003c/h3>\u003cp>由 DEX 偏移找到 \u003ccode>code_item\u003c/code>。\u003c/p>\u003c/div>\n          \u003cdiv id=\"machine-code\" class=\"object\">\u003ch3>机器码入口\u003c/h3>\u003cp>本例沿 quick 槽到原方法的机器码。\u003c/p>\u003c/div>\n        \u003c/div>\n      \u003c/aside>\n    \u003c/div>\n    \u003cdiv class=\"annotation\" aria-live=\"polite\" aria-atomic=\"true\">\n      \u003ch2 id=\"current-title\">\u003c/h2>\n      \u003cp id=\"current-text\">\u003c/p>\n    \u003c/div>\n  \u003c/section>\n  \u003cfooter>\n    \u003cspan class=\"hint\">示例选用普通实例方法的反射 quick 路径，假定原方法已编译。\u003c/span>\n    \u003ca href=\"https://android.googlesource.com/platform/libcore/+/refs/tags/android-7.1.2_r39/ojluni/src/main/java/java/lang/reflect/Method.java#509\">Java API\u003c/a>\n    \u003ca href=\"https://android.googlesource.com/platform/art/+/refs/tags/android-7.1.2_r39/runtime/native/java_lang_reflect_Method.cc#99\">JNI 入口\u003c/a>\n    \u003ca href=\"https://android.googlesource.com/platform/art/+/refs/tags/android-7.1.2_r39/runtime/reflection.cc#576\">反射解码\u003c/a>\n    \u003ca href=\"https://android.googlesource.com/platform/art/+/refs/tags/android-7.1.2_r39/runtime/mirror/abstract_method.cc#42\">GetArtMethod\u003c/a>\n    \u003ca href=\"https://android.googlesource.com/platform/art/+/refs/tags/android-7.1.2_r39/runtime/art_method.h#710\">ArtMethod 字段\u003c/a>\n  \u003c/footer>\n  \u003cnoscript>\u003cp>启用 JavaScript 后即可播放。\u003c/p>\u003c/noscript>\n\u003c/main>\n\u003cscript>\n  const frames = [\n    ['Java 发起调用','应用拿到代表 Gate.check 的 Method 对象，传入接收者 gate 和参数 \"demo\"。',['java-method']],\n    ['进入 Java 标准库 API','Method.invoke() 在 Android 的 libcore 中声明为 native。ART 用 JNI 注册表把它绑定到 Method_invoke()。',['java-method']],\n    ['进入 Native 层','Method_invoke() 拿到反射对象、接收者和实参的 JNI 引用，然后调用 ART 的 InvokeMethod()。',['java-method']],\n    ['从 Java 对象取出 ArtMethod 指针','InvokeMethod() 在 ART 里把反射对象解码成 mirror::AbstractMethod 视图，再用 GetArtMethod() 读出该对象里的 native 方法指针。',['java-method','art-method']],\n    ['确定实际实现并准备实参','对于实例方法，ART 根据接收者的类选出要调用的实现。参数整理完成后，InvokeWithArgArray() 调用选中的 ArtMethod::Invoke()。',['art-method']],\n    ['从 quick 槽进入原方法','这个示例走 quick 分支。ARM64 stub 从 ArtMethod 的 quick 槽取出编译代码入口并调用它。DEX 偏移用于定位字节码，本次分支沿机器码入口执行。',['art-method','machine-code']],\n    ['把结果交回 Java','编译代码的结果先回到 ART，反射层再将 primitive 返回值按需装箱，Method.invoke() 把对象结果交回 Java 调用方。',[]]\n  ];\n  const byId = id => document.getElementById(id);\n  const list = document.querySelector('.layer-list');\n  const layers = [...document.querySelectorAll('.layer')];\n  const token = document.querySelector('.token');\n  const objects = [...document.querySelectorAll('.object')];\n  const play = byId('play');\n  let step = 0;\n  let timer = null;\n\n  function position(animate) {\n    const outer = list.getBoundingClientRect();\n    const target = layers[step].getBoundingClientRect();\n    token.classList.toggle('moving', animate);\n    token.style.transform = `translateY(${target.top - outer.top + (target.height - 10) / 2}px)`;\n    token.hidden = false;\n  }\n  function draw(animate = true) {\n    const [title, text, visible] = frames[step];\n    layers.forEach((layer, i) => {\n      if (i === step) layer.setAttribute('aria-current','step');\n      else layer.removeAttribute('aria-current');\n    });\n    objects.forEach(object => object.classList.toggle('live', visible.includes(object.id)));\n    byId('current-title').textContent = title;\n    byId('current-text').textContent = text;\n    byId('progress').textContent = `第 ${step + 1} / ${frames.length} 步`;\n    byId('prev').disabled = step === 0;\n    byId('next').disabled = step === frames.length - 1;\n    play.textContent = timer !== null ? '暂停' : step === frames.length - 1 ? '重播' : '播放';\n    position(animate);\n  }\n  function pause() {\n    if (timer !== null) clearInterval(timer);\n    timer = null;\n  }\n  function seek(next) {\n    pause();\n    step = Math.max(0, Math.min(frames.length - 1, next));\n    draw();\n  }\n  play.addEventListener('click', () => {\n    if (timer !== null) { pause(); draw(); return; }\n    if (step === frames.length - 1) step = 0;\n    timer = setInterval(() => {\n      step++;\n      if (step === frames.length - 1) pause();\n      draw();\n    }, 2400);\n    draw();\n  });\n  byId('prev').addEventListener('click', () => seek(step - 1));\n  byId('next').addEventListener('click', () => seek(step + 1));\n  byId('reset').addEventListener('click', () => seek(0));\n  layers.forEach((node, i) => node.addEventListener('click', () => seek(i)));\n  if ('ResizeObserver' in window) new ResizeObserver(() => position(false)).observe(list);\n  else window.addEventListener('resize', () => position(false));\n  draw(false);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"install":{"title":"安装 Hook","file":"xposed-art-structure-animation.html","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Xposed Hook 怎样改变 ART 的方法结构\u003c/title>\n\u003cstyle>\n  :root{--bg:#eef3f7;--ink:#152c40;--sub:#466071;--line:#cfdae4;--blue:#214d88;--blue-bg:#e9f1ff;--green:#08634c;--green-bg:#e8f6ef}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,\"Microsoft YaHei\",sans-serif}\n  main{max-width:1160px;margin:auto;padding:32px 24px 48px}\n  h1,h2,h3,p{margin:0}\n  h1{font-size:clamp(28px,4.8vw,46px);line-height:1.18;margin:8px 0}\n  h2{font-size:18px}\n  h3{font-size:15px}\n  code,pre{font-family:\"Cascadia Code\",Consolas,monospace}\n  code{overflow-wrap:anywhere}\n  a{color:var(--blue);text-underline-offset:3px}\n  .kicker,.lead,.hint{color:var(--sub)}\n  .kicker,.hint{font-size:13px}\n  .lead{margin-bottom:16px}\n  .board{background:#fff;border:1px solid var(--line);border-radius:12px}\n  .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line)}\n  button{font:inherit;cursor:pointer}\n  .toolbar button{min-height:38px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:4px 10px;font-size:14px}\n  .toolbar button:disabled{opacity:.55;cursor:default}\n  .toolbar #play{min-width:72px;background:var(--blue);color:white;border-color:var(--blue)}\n  button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}\n  #progress{margin-left:auto;color:var(--sub);font-size:13px}\n  .diagram{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}\n  .layers,.objects{padding:14px 16px 16px;min-width:0}\n  .layers{position:relative}\n  .objects{border-left:1px solid var(--line);background:#f8fafc}\n  .layer-list{list-style:none;margin:8px 0 0;padding:0 0 0 20px;position:relative}\n  .layer-list::before{content:'';position:absolute;left:4px;top:23px;bottom:23px;border-left:2px solid #a5b8cf}\n  .layer-list li{position:relative;margin:0 0 8px}\n  .layer-list > li:nth-last-child(2){margin:0}\n  .layer{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}\n  .layer b,.layer code{display:block}\n  .layer code{font-size:12px;color:var(--sub)}\n  .layer[aria-current=step]{background:var(--blue-bg);border-color:var(--blue)}\n  .layer-list > .token{position:absolute;left:0;top:0;margin:0;width:10px;height:10px;z-index:1;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #c9dfff;pointer-events:none}\n  .token.moving{transition:transform .55s cubic-bezier(.22,.7,.24,1)}\n  .object{border:1px solid var(--line);border-radius:6px;background:white;overflow:hidden}\n  .object h3{padding:6px 9px;background:#f1f5f9}\n  .object p,.object dl{padding:6px 9px;margin:0;font-size:13px}\n  .object dl>div+div{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}\n  .object dt{font-weight:650}\n  .object dd{margin:0;color:var(--sub);overflow-wrap:anywhere}\n  .object.live{border-color:var(--green)}\n  .object.live h3{background:var(--green-bg);color:var(--green)}\n  .objects h2{margin-bottom:8px}\n  .relation{font-size:12px;color:var(--sub);padding:2px 0 2px 12px}\n  .relation b{color:var(--green);font-size:16px}\n  .native-out{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}\n  .annotation{border-top:1px solid var(--line);padding:12px 16px;min-height:88px}\n  .annotation p{color:var(--sub);margin-top:3px}\n  footer{display:flex;gap:5px 14px;flex-wrap:wrap;margin-top:12px;font-size:13px}\n  @media(max-width:700px){main{padding:20px 12px 30px}.diagram{grid-template-columns:minmax(0,1fr)}.objects{border-left:0;border-top:1px solid var(--line)}}\n  @media(max-width:400px){#progress{margin-left:0}.native-out{grid-template-columns:minmax(0,1fr)}}\n  @media(prefers-reduced-motion:reduce){.token.moving{transition:none}}\n\n  [hidden]{display:none!important}\n  .object dl>div.changed{background:var(--green-bg);border-left:3px solid var(--green);padding-left:6px}\n  .object dl>div.changed dd{color:var(--green);font-weight:650;overflow-wrap:anywhere}\n  .pending-text{color:var(--sub)}\n  .dex-note{margin-top:8px}\n  .operation{margin:8px 0 0;padding:7px 9px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:5px;background:#edf3fb;color:#173550;font-size:13px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003cp class=\"kicker\">Android 7.1.2 · Xposed v89 · ART fork v89-sdk25\u003c/p>\n  \u003ch1>Xposed Hook 怎样改变 ART 的方法结构\u003c/h1>\n  \u003cp class=\"lead\">左边跟着安装过程走，右边看三个对象怎样建立关系、哪些字段被改写。可以逐步播放，再和 \u003ca href=\"art-normal-execution-animation.html\">正常调用动画\u003c/a> 对照。\u003c/p>\n  \u003csection class=\"board\" aria-label=\"Xposed 安装 Hook 的结构变化动画\">\n    \u003cdiv class=\"toolbar\">\n      \u003cbutton type=\"button\" id=\"play\">播放\u003c/button>\n      \u003cbutton type=\"button\" id=\"prev\">上一步\u003c/button>\n      \u003cbutton type=\"button\" id=\"next\">下一步\u003c/button>\n      \u003cbutton type=\"button\" id=\"reset\">重置\u003c/button>\n      \u003coutput id=\"progress\" aria-live=\"polite\">\u003c/output>\n    \u003c/div>\n    \u003cdiv class=\"diagram\">\n      \u003cdiv class=\"layers\">\n        \u003ch2>安装步骤\u003c/h2>\n        \u003col class=\"layer-list\">\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>安装前\u003c/b>\u003ccode>Java Method → 目标 ArtMethod\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>定位目标\u003c/b>\u003ccode>Java → JNI → FromReflectedMethod()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>复制原方法\u003c/b>\u003ccode>566–568 行 · CreateRuntimeMethod / CopyFrom\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>创建 Hook 信息\u003c/b>\u003ccode>570–583 行 · XposedHookInfo\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>写 JNI 槽\u003c/b>\u003ccode>599 行 · SetEntryPointFromJniPtrSize()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>写 quick 槽\u003c/b>\u003ccode>600 行 · SetEntryPointFromQuickCompiledCode()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>更新目标标记\u003c/b>\u003ccode>601 / 605 行 · DEX 偏移与访问标志\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>之后调用\u003c/b>\u003ccode>目标方法 → 代理 → JNI 槽 → Hook 信息\u003c/code>\u003c/button>\u003c/li>\n          \u003cli class=\"token\" aria-hidden=\"true\" hidden>\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n      \u003caside class=\"objects\" aria-label=\"ART 对象与字段变化\">\n        \u003ch2>对象与字段\u003c/h2>\n        \u003cdiv class=\"object\" id=\"reflected\">\n          \u003ch3>Java 反射对象 · \u003ccode>Method\u003c/code>\u003c/h3>\n          \u003cp>注册时传入的反射对象 \u003cstrong>→ 目标 ArtMethod\u003c/strong>\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"relation\">\u003cb>↓\u003c/b> \u003ccode>FromReflectedMethod()\u003c/code> 取出目标指针\u003c/div>\n        \u003cdiv class=\"object\" id=\"target\">\n          \u003ch3>目标 \u003ccode>ArtMethod\u003c/code> · 调用方命中的对象\u003c/h3>\n          \u003cdl>\n            \u003cdiv id=\"t-jni\">\u003cdt>JNI 槽 \u003ccode>entry_point_from_jni_\u003c/code>\u003c/dt>\u003cdd>\u003c/dd>\u003c/div>\n            \u003cdiv id=\"t-quick\">\u003cdt>quick 槽 \u003ccode>entry_point_from_quick_compiled_code_\u003c/code>\u003c/dt>\u003cdd>\u003c/dd>\u003c/div>\n            \u003cdiv id=\"t-dex\">\u003cdt>\u003ccode>dex_code_item_offset_\u003c/code>\u003c/dt>\u003cdd>\u003c/dd>\u003c/div>\n            \u003cdiv id=\"t-flags\">\u003cdt>访问标志\u003c/dt>\u003cdd>\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/div>\n        \u003cdiv class=\"relation\" id=\"hook-arrow\" hidden>\u003cb>↓\u003c/b> 目标 JNI 槽中的 \u003ccode>hook_info\u003c/code> 指向下方的 Hook 信息\u003c/div>\n        \u003cdiv class=\"native-out\">\n          \u003cdiv class=\"object\" id=\"info\">\n            \u003ch3>\u003ccode>XposedHookInfo\u003c/code>\u003c/h3>\n            \u003cp class=\"pending-text\">尚未创建\u003c/p>\n            \u003cdl class=\"object-fields\" hidden>\n              \u003cdiv>\u003cdt>\u003ccode>reflected_method\u003c/code>\u003c/dt>\u003cdd>关联备份的 Java 反射对象\u003c/dd>\u003c/div>\n              \u003cdiv>\u003cdt>\u003ccode>original_method\u003c/code>\u003c/dt>\u003cdd>指向备份 \u003ccode>ArtMethod\u003c/code> →\u003c/dd>\u003c/div>\n              \u003cdiv>\u003cdt>\u003ccode>additional_info\u003c/code>\u003c/dt>\u003cdd>Java 回调集合等信息\u003c/dd>\u003c/div>\n            \u003c/dl>\n          \u003c/div>\n          \u003cdiv class=\"object\" id=\"backup\">\n            \u003ch3>备份 \u003ccode>ArtMethod\u003c/code>\u003c/h3>\n            \u003cp class=\"pending-text\">尚未创建\u003c/p>\n            \u003cdl class=\"object-fields\" hidden>\n              \u003cdiv>\u003cdt>quick 槽\u003c/dt>\u003cdd>原执行路径，JIT 情况可换成解释器桥\u003c/dd>\u003c/div>\n              \u003cdiv>\u003cdt>DEX 偏移\u003c/dt>\u003cdd>保留原偏移\u003c/dd>\u003c/div>\n              \u003cdiv>\u003cdt>访问标志\u003c/dt>\u003cdd>\u003ccode>kAccXposedOriginalMethod\u003c/code>\u003c/dd>\u003c/div>\n            \u003c/dl>\n          \u003c/div>\n        \u003c/div>\n        \u003cp class=\"hint dex-note\">两个 \u003ccode>ArtMethod\u003c/code> 是不同对象。清零的是目标对象的 DEX 偏移，DEX 文件里的指令仍在。\u003c/p>\n      \u003c/aside>\n    \u003c/div>\n    \u003cdiv class=\"annotation\" aria-live=\"polite\" aria-atomic=\"true\">\n      \u003ch2 id=\"current-title\">\u003c/h2>\n      \u003cp id=\"current-text\">\u003c/p>\n      \u003cpre class=\"operation\">\u003ccode id=\"current-code\">\u003c/code>\u003c/pre>\n    \u003c/div>\n  \u003c/section>\n  \u003cfooter>\n    \u003cspan class=\"hint\">动画按 ART fork 的源码顺序呈现安装后的字段变化。\u003c/span>\n    \u003ca href=\"https://github.com/rovo89/Xposed/blob/v89/libxposed_art.cpp#L78-L95\">JNI 安装入口\u003c/a>\n    \u003ca href=\"https://github.com/rovo89/android_art/blob/v89-sdk25/runtime/art_method.cc#L553-L609\">EnableXposedHook 源码\u003c/a>\n    \u003ca href=\"https://github.com/rovo89/android_art/blob/v89-sdk25/runtime/art_method.h#L748-L755\">读回 Hook 信息\u003c/a>\n    \u003ca href=\"xposed-art-hook-principle.html#entry-implementation\">回到源码文章\u003c/a>\n  \u003c/footer>\n  \u003cnoscript>\u003cp>启用 JavaScript 后即可播放。\u003c/p>\u003c/noscript>\n\u003c/main>\n\u003cscript>\n  const frames = [\n    ['安装前：Java Method 关联目标 ArtMethod','这时目标方法仍有原来的 quick 入口和 DEX 偏移。备份和 Hook 信息都还没有创建。','', ['reflected','target'], []],\n    ['JNI 找到要改写的目标对象','Java 的 hookMethodNative 进入 libxposed_art.cpp。FromReflectedMethod() 由传入的 Java Method 拿到目标 ArtMethod*。','ArtMethod::FromReflectedMethod(soa, javaReflectedMethod)', ['reflected','target'], []],\n    ['分配并复制出原方法备份','CreateRuntimeMethod() 分配新的 ArtMethod。CopyFrom() 复制方法结构，随后给备份加上原方法标记。若原 quick 入口在 JIT 缓存，备份可改走解释器桥。','backup_method->CopyFrom(this, cl->GetImagePointerSize())', ['backup'], []],\n    ['建立 XposedHookInfo','创建指向备份的 Java 反射对象，并把它、原方法备份指针和模块回调信息一并存进 XposedHookInfo。','hook_info->original_method = backup_method;', ['info','backup'], []],\n    ['599 行：在目标的 JNI 槽存地址','把 XposedHookInfo 的地址写入目标 ArtMethod。这个槽保存的是对象的指针，之后分发会从同一个槽读回来。','SetEntryPointFromJniPtrSize(…, sizeof(void*));', ['target','info'], ['t-jni']],\n    ['600 行：把目标的 quick 槽改成代理入口','GetQuickProxyInvokeHandler() 给出汇编代理入口地址。setter 只更新目标的 quick 槽，备份仍保留自己的执行路径。','SetEntryPointFromQuickCompiledCode(GetQuickProxyInvokeHandler());', ['target'], ['t-quick']],\n    ['601、605 行：清零目标偏移，标记已 Hook','把目标的 DEX code_item 偏移设为 0，再更新访问标志。原偏移仍在改写之前复制出来的备份中。','SetCodeItemOffset(0);  // 目标 ArtMethod\\nSetAccessFlags(… | kAccXposedHookedMethod);', ['target','backup'], ['t-dex','t-flags']],\n    ['调用时：先走代理，再读取 Hook 信息','调用命中目标 quick 槽时会进入代理，分发逻辑从目标 JNI 槽读回 XposedHookInfo。需要执行原实现时，框架使用备份。','目标 quick 槽 → 代理\\n目标 JNI 槽 → XposedHookInfo → 备份 ArtMethod', ['target','info','backup'], ['t-jni','t-quick']]\n  ];\n  const byId = id => document.getElementById(id);\n  const list = document.querySelector('.layer-list');\n  const layers = [...document.querySelectorAll('.layer')];\n  const token = document.querySelector('.token');\n  const objects = [...document.querySelectorAll('.object')];\n  const play = byId('play');\n  let step = 0;\n  let timer = null;\n\n  function position(animate) {\n    const outer = list.getBoundingClientRect();\n    const target = layers[step].getBoundingClientRect();\n    token.classList.toggle('moving', animate);\n    token.style.transform = `translateY(${target.top - outer.top + (target.height - 10) / 2}px)`;\n    token.hidden = false;\n  }\n  function draw(animate = true) {\n    const [title, text, operation, active, changes] = frames[step];\n    layers.forEach((layer, i) => {\n      if (i === step) layer.setAttribute('aria-current','step');\n      else layer.removeAttribute('aria-current');\n    });\n    objects.forEach(object => object.classList.toggle('live', active.includes(object.id)));\n    for (const [id, created] of [['backup',2],['info',3]]) {\n      const object = byId(id);\n      object.querySelector('.pending-text').hidden = step >= created;\n      object.querySelector('.object-fields').hidden = step \u003c created;\n    }\n    byId('hook-arrow').hidden = step \u003c 4;\n    const values = {\n      't-jni': step >= 4 ? '→ XposedHookInfo' : '安装前的原值',\n      't-quick': step >= 5 ? '→ art_quick_proxy_invoke_handler' : '→ 原方法执行入口',\n      't-dex': step >= 6 ? '0' : '原 DEX code_item 偏移',\n      't-flags': step >= 6 ? '已设置 kAccXposedHookedMethod' : '尚未设置 Hook 标记',\n    };\n    for (const [id,value] of Object.entries(values)) {\n      const field = byId(id);\n      field.querySelector('dd').textContent = value;\n      field.classList.toggle('changed', changes.includes(id));\n    }\n    byId('current-code').textContent = operation;\n    byId('current-code').parentElement.hidden = !operation;\n    byId('current-title').textContent = title;\n    byId('current-text').textContent = text;\n    byId('progress').textContent = `第 ${step + 1} / ${frames.length} 步`;\n    byId('prev').disabled = step === 0;\n    byId('next').disabled = step === frames.length - 1;\n    play.textContent = timer !== null ? '暂停' : step === frames.length - 1 ? '重播' : '播放';\n    position(animate);\n  }\n  function pause() {\n    if (timer !== null) clearInterval(timer);\n    timer = null;\n  }\n  function seek(next) {\n    pause();\n    step = Math.max(0, Math.min(frames.length - 1, next));\n    draw();\n  }\n  play.addEventListener('click', () => {\n    if (timer !== null) { pause(); draw(); return; }\n    if (step === frames.length - 1) step = 0;\n    timer = setInterval(() => {\n      step++;\n      if (step === frames.length - 1) pause();\n      draw();\n    }, 2400);\n    draw();\n  });\n  byId('prev').addEventListener('click', () => seek(step - 1));\n  byId('next').addEventListener('click', () => seek(step + 1));\n  byId('reset').addEventListener('click', () => seek(0));\n  layers.forEach((node, i) => node.addEventListener('click', () => seek(i)));\n  if ('ResizeObserver' in window) new ResizeObserver(() => position(false)).observe(list);\n  else window.addEventListener('resize', () => position(false));\n  draw(false);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"invoke":{"title":"注册后执行","file":"xposed-art-after-registration-animation.html","html":"\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Hook 注册后，一次方法调用怎么执行？\u003c/title>\n\u003cstyle>\n  :root{--bg:#eef3f7;--ink:#152c40;--sub:#466071;--line:#cfdae4;--blue:#214d88;--blue-bg:#e9f1ff;--green:#08634c;--green-bg:#e8f6ef}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,\"Microsoft YaHei\",sans-serif}\n  main{max-width:1160px;margin:auto;padding:32px 24px 48px}\n  h1,h2,h3,p{margin:0}\n  h1{font-size:clamp(28px,4.8vw,46px);line-height:1.18;margin:8px 0}\n  h2{font-size:18px}\n  h3{font-size:15px}\n  code,pre{font-family:\"Cascadia Code\",Consolas,monospace}\n  code{overflow-wrap:anywhere}\n  a{color:var(--blue);text-underline-offset:3px}\n  .kicker,.lead,.hint{color:var(--sub)}\n  .kicker,.hint{font-size:13px}\n  .lead{margin-bottom:16px}\n  .board{background:#fff;border:1px solid var(--line);border-radius:12px}\n  .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line)}\n  button{font:inherit;cursor:pointer}\n  .toolbar button{min-height:38px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:4px 10px;font-size:14px}\n  .toolbar button:disabled{opacity:.55;cursor:default}\n  .toolbar #play{min-width:72px;background:var(--blue);color:white;border-color:var(--blue)}\n  button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}\n  #progress{margin-left:auto;color:var(--sub);font-size:13px}\n  .diagram{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}\n  .layers,.objects{padding:14px 16px 16px;min-width:0}\n  .layers{position:relative}\n  .objects{border-left:1px solid var(--line);background:#f8fafc}\n  .layer-list{list-style:none;margin:8px 0 0;padding:0 0 0 20px;position:relative}\n  .layer-list::before{content:'';position:absolute;left:4px;top:23px;bottom:23px;border-left:2px solid #a5b8cf}\n  .layer-list li{position:relative;margin:0 0 8px}\n  .layer-list > li:nth-last-child(2){margin:0}\n  .layer{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}\n  .layer b,.layer code{display:block}\n  .layer code{font-size:12px;color:var(--sub)}\n  .layer[aria-current=step]{background:var(--blue-bg);border-color:var(--blue)}\n  .layer-list > .token{position:absolute;left:0;top:0;margin:0;width:10px;height:10px;z-index:1;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #c9dfff;pointer-events:none}\n  .token.moving{transition:transform .55s cubic-bezier(.22,.7,.24,1)}\n  .object{border:1px solid var(--line);border-radius:6px;background:white;overflow:hidden}\n  .object h3{padding:6px 9px;background:#f1f5f9}\n  .object p,.object dl{padding:6px 9px;margin:0;font-size:13px}\n  .object dl>div+div{border-top:1px solid var(--line);margin-top:5px;padding-top:5px}\n  .object dt{font-weight:650}\n  .object dd{margin:0;color:var(--sub);overflow-wrap:anywhere}\n  .object.live{border-color:var(--green)}\n  .object.live h3{background:var(--green-bg);color:var(--green)}\n  .objects h2{margin-bottom:8px}\n  .relation{font-size:12px;color:var(--sub);padding:2px 0 2px 12px}\n  .relation b{color:var(--green);font-size:16px}\n  .native-out{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}\n  .annotation{border-top:1px solid var(--line);padding:12px 16px;min-height:88px}\n  .annotation p{color:var(--sub);margin-top:3px}\n  footer{display:flex;gap:5px 14px;flex-wrap:wrap;margin-top:12px;font-size:13px}\n  @media(max-width:700px){main{padding:20px 12px 30px}.diagram{grid-template-columns:minmax(0,1fr)}.objects{border-left:0;border-top:1px solid var(--line)}}\n  @media(max-width:400px){#progress{margin-left:0}.native-out{grid-template-columns:minmax(0,1fr)}}\n  @media(prefers-reduced-motion:reduce){.token.moving{transition:none}}\n\n  [hidden]{display:none!important}\n  .object dl>div.changed{background:var(--green-bg);border-left:3px solid var(--green);padding-left:6px}\n  .object dl>div.changed dd{color:var(--green);font-weight:650;overflow-wrap:anywhere}\n  .pending-text{color:var(--sub)}\n  .dex-note{margin-top:8px}\n  .operation{margin:8px 0 0;padding:7px 9px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:5px;background:#edf3fb;color:#173550;font-size:13px}\n\n  .toolbar label{font-size:13px;color:var(--sub)}\n  .toolbar select{max-width:100%;min-height:38px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:inherit;font-size:14px}\n  .toolbar select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}\n  .layer.skipped{border-style:dashed}\n  .result{margin-top:6px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003cp class=\"kicker\">Android 7.1.2 · Xposed v89 · ART fork v89-sdk25\u003c/p>\n  \u003ch1>Hook 注册后，一次方法调用怎么执行？\u003c/h1>\n  \u003cp class=\"lead\">从 Hook 已安装开始。左侧跟踪执行位置，右侧显示当前用到的对象。可以对照 \u003ca href=\"art-normal-execution-animation.html\">正常调用\u003c/a> 和 \u003ca href=\"xposed-art-structure-animation.html\">Hook 安装时的字段变化\u003c/a>。\u003c/p>\n  \u003csection class=\"board\" aria-label=\"Hook 注册后的方法执行动画\">\n    \u003cdiv class=\"toolbar\">\n      \u003clabel for=\"scenario\">调用场景\u003c/label>\n      \u003cselect id=\"scenario\">\n        \u003coption value=\"original\">继续执行原方法\u003c/option>\n        \u003coption value=\"early\">before 设置 false\u003c/option>\n      \u003c/select>\n      \u003cbutton type=\"button\" id=\"play\">播放\u003c/button>\n      \u003cbutton type=\"button\" id=\"prev\">上一步\u003c/button>\n      \u003cbutton type=\"button\" id=\"next\">下一步\u003c/button>\n      \u003cbutton type=\"button\" id=\"reset\">重置\u003c/button>\n      \u003coutput id=\"progress\" aria-live=\"polite\">\u003c/output>\n    \u003c/div>\n    \u003cdiv class=\"diagram\">\n      \u003cdiv class=\"layers\">\n        \u003ch2>调用经过的地方\u003c/h2>\n        \u003col class=\"layer-list\">\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>Java 调用\u003c/b>\u003ccode>Method.invoke(gate, …)\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>命中目标 quick 槽\u003c/b>\u003ccode>ArtMethod::Invoke() → ARM64 stub → blr x9\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>进入 ART 代理\u003c/b>\u003ccode>汇编入口 → artQuickProxyInvokeHandler()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>读回 Hook 信息\u003c/b>\u003ccode>GetXposedHookInfo() → JNI → Java\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>执行模块的 before\u003c/b>\u003ccode>XposedBridge.handleHookedMethod()\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>判断是否执行原方法\u003c/b>\u003ccode>invokeOriginalMethodNative() 或跳过\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>执行对应的 after\u003c/b>\u003ccode>逆序执行，可改变结果\u003c/code>\u003c/button>\u003c/li>\n          \u003cli>\u003cbutton class=\"layer\" type=\"button\">\u003cb>把结果交回调用方\u003c/b>\u003ccode>Java → JNI → ARM64 → 反射层\u003c/code>\u003c/button>\u003c/li>\n          \u003cli class=\"token\" aria-hidden=\"true\" hidden>\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n      \u003caside class=\"objects\" aria-label=\"执行过程中用到的对象\">\n        \u003ch2>对象与本次调用状态\u003c/h2>\n        \u003cdiv class=\"object\" id=\"target\">\n          \u003ch3>目标 \u003ccode>ArtMethod\u003c/code>\u003c/h3>\n          \u003cdl>\n            \u003cdiv id=\"quick\">\u003cdt>quick 槽\u003c/dt>\u003cdd>→ \u003ccode>art_quick_proxy_invoke_handler\u003c/code>\u003c/dd>\u003c/div>\n            \u003cdiv id=\"jni\">\u003cdt>JNI 槽\u003c/dt>\u003cdd>→ \u003ccode>XposedHookInfo\u003c/code>\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/div>\n        \u003cdiv class=\"relation\">\u003cb>↓\u003c/b> JNI 分发辅助函数从这个槽读回 Hook 信息\u003c/div>\n        \u003cdiv class=\"object\" id=\"info\">\n          \u003ch3>\u003ccode>XposedHookInfo\u003c/code>\u003c/h3>\n          \u003cdl>\n            \u003cdiv>\u003cdt>\u003ccode>additional_info\u003c/code>\u003c/dt>\u003cdd>包含 Java 回调集合\u003c/dd>\u003c/div>\n            \u003cdiv>\u003cdt>\u003ccode>reflected_method\u003c/code>\u003c/dt>\u003cdd>指向备份的 Java 反射对象\u003c/dd>\u003c/div>\n          \u003c/dl>\n        \u003c/div>\n        \u003cdiv class=\"native-out\">\n          \u003cdiv class=\"object\" id=\"callback\">\u003ch3>\u003ccode>MethodHookParam\u003c/code>\u003c/h3>\u003cp id=\"param-state\">\u003c/p>\u003c/div>\n          \u003cdiv class=\"object\" id=\"backup\">\u003ch3>备份 \u003ccode>ArtMethod\u003c/code>\u003c/h3>\u003cp id=\"backup-state\">\u003c/p>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"object result\" id=\"result\">\u003ch3>调用方\u003c/h3>\u003cp id=\"result-state\">\u003c/p>\u003c/div>\n      \u003c/aside>\n    \u003c/div>\n    \u003cdiv class=\"annotation\" aria-live=\"polite\" aria-atomic=\"true\">\n      \u003ch2 id=\"current-title\">\u003c/h2>\n      \u003cp id=\"current-text\">\u003c/p>\n      \u003cpre class=\"operation\">\u003ccode id=\"current-code\">\u003c/code>\u003c/pre>\n    \u003c/div>\n  \u003c/section>\n  \u003cfooter>\n    \u003cspan class=\"hint\">经典 Xposed v89 / Android 7.1.2。示例走反射 quick 路径，假设原方法返回 true，after 保留结果。\u003c/span>\n    \u003ca href=\"xposed-art-hook-principle.html#dispatch\">执行章节与源码\u003c/a>\n    \u003ca href=\"xposed-art-hook-principle.html#original-call\">调用原方法\u003c/a>\n    \u003ca href=\"xposed-art-hook-principle.html#return-to-caller\">返回路径\u003c/a>\n  \u003c/footer>\n  \u003cnoscript>\u003cp>启用 JavaScript 后即可播放。\u003c/p>\u003c/noscript>\n\u003c/main>\n\u003cscript>\n  const frames = [\n  [\n    \"Java 发起一次调用\",\n    \"Hook 已经注册。应用通过 Method.invoke() 请求调用目标方法，沿本文的反射 quick 分支进入 ART。\",\n    \"method.invoke(gate, arg)\",\n    [\n      \"target\"\n    ],\n    []\n  ],\n  [\n    \"读取已经改写的 quick 槽\",\n    \"ARM64 stub 从目标 ArtMethod 的 quick 槽读取代理入口地址，blr x9 跳到该地址。\",\n    \"ldr x9, [x0, #ART_METHOD_QUICK_CODE_OFFSET_64]\\nblr x9\",\n    [\n      \"target\"\n    ],\n    [\n      \"quick\"\n    ]\n  ],\n  [\n    \"汇编进入 C++ 代理处理器\",\n    \"汇编准备好栈帧后调用 C++ 处理器。它检查 kAccXposedHookedMethod，整理接收者与实参，进入 Xposed 分支。\",\n    \"art_quick_proxy_invoke_handler\\n  → artQuickProxyInvokeHandler()\",\n    [\n      \"target\"\n    ],\n    [\n      \"quick\"\n    ]\n  ],\n  [\n    \"取出 Hook 信息，进入 Java 分发\",\n    \"JNI 辅助函数读回目标的 XposedHookInfo，并把备份的反射对象和回调信息交给 XposedBridge.handleHookedMethod()。\",\n    \"GetXposedHookInfo()\\n  → CallStaticObjectMethodA(…, handleHookedMethod, …)\",\n    [\n      \"target\",\n      \"info\"\n    ],\n    [\n      \"jni\"\n    ]\n  ],\n  [\n    \"运行模块注册的 before 回调\",\n    \"Java 分发取回调快照，构建 MethodHookParam，再调用模块重写的 beforeHookedMethod()。\",\n    \"callback.beforeHookedMethod(param)\",\n    [\n      \"info\",\n      \"callback\"\n    ],\n    []\n  ],\n  [\n    \"通过备份执行原方法\",\n    \"before 未要求提前返回。JNI 把已指向备份的反射对象交给 ART，最终执行备份 ArtMethod 对应的原实现。\",\n    \"invokeOriginalMethodNative(backupMethod, 1, …)\\n  → InvokeMethod() → 备份 ArtMethod::Invoke()\",\n    [\n      \"callback\",\n      \"backup\"\n    ],\n    []\n  ],\n  [\n    \"逆序运行对应的 after\",\n    \"对已执行过 before 的回调，按相反顺序调用 after。它们可以改结果或异常，本例保留当前结果。\",\n    \"callback.afterHookedMethod(param)\",\n    [\n      \"callback\"\n    ],\n    []\n  ],\n  [\n    \"结果回到 Java 调用方\",\n    \"Java 分发返回 Boolean，JNI 拆箱后把结果交给 ARM64 stub。由于示例走 Method.invoke()，反射层最后为 Java 调用方再次装箱。\",\n    \"Java Boolean → JNI 拆箱 → ARM64 返回\\n  → 反射层装箱 → Java 调用方\",\n    [\n      \"result\"\n    ],\n    []\n  ]\n];\n  const earlyStep = [\"跳过备份方法\", \"before 调用 setResult(false)，returnEarly 变成 true。原方法这一段没有执行，分发直接去运行对应的 after。\", \"param.setResult(false)\\nreturnEarly = true → 跳过 invokeOriginalMethodNative()\", [\"callback\"], []];\n  const byId = id => document.getElementById(id);\n  const list = document.querySelector('.layer-list');\n  const layers = [...document.querySelectorAll('.layer')];\n  const token = document.querySelector('.token');\n  const objects = [...document.querySelectorAll('.object')];\n  const play = byId('play');\n  let step = 0;\n  let timer = null;\n\n  function position(animate) {\n    const outer = list.getBoundingClientRect();\n    const target = layers[step].getBoundingClientRect();\n    token.classList.toggle('moving', animate);\n    token.style.transform = `translateY(${target.top - outer.top + (target.height - 10) / 2}px)`;\n    token.hidden = false;\n  }\n  function draw(animate = true) {\n    const early = byId('scenario').value === 'early';\n    const [title, text, operation, active, changes] = early && step === 5 ? earlyStep : frames[step];\n    layers.forEach((layer, i) => {\n      if (i === step) layer.setAttribute('aria-current','step');\n      else layer.removeAttribute('aria-current');\n    });\n    layers[5].classList.toggle('skipped', early);\n    layers[5].querySelector('code').textContent = early ? 'returnEarly = true → 不执行备份' : 'invokeOriginalMethodNative() → 执行备份';\n    objects.forEach(object => object.classList.toggle('live', active.includes(object.id)));\n    for (const id of ['quick','jni']) byId(id).classList.toggle('changed', changes.includes(id));\n    const value = early ? 'false' : 'true';\n    byId('param-state').textContent = step \u003c 4 ? '尚未创建'\n      : step === 4 ? (early ? 'before 设置 false，returnEarly = true' : 'before 结束，returnEarly = false')\n      : step === 5 ? (early ? '保留 before 设置的 false' : '写入原方法返回的 true')\n      : '结果为 ' + value + '，after 保持不变';\n    byId('backup-state').textContent = step \u003c 5 ? '已存在，本次尚未调用'\n      : early ? '跳过，本次不执行' : '已执行，原实现返回 true';\n    byId('result-state').textContent = step \u003c 7 ? '等待返回'\n      : early ? '收到 Boolean.FALSE' : '收到 Boolean.TRUE';\n    byId('current-code').textContent = operation;\n    byId('current-code').parentElement.hidden = !operation;\n    byId('current-title').textContent = title;\n    byId('current-text').textContent = text;\n    byId('progress').textContent = `第 ${step + 1} / ${frames.length} 步`;\n    byId('prev').disabled = step === 0;\n    byId('next').disabled = step === frames.length - 1;\n    play.textContent = timer !== null ? '暂停' : step === frames.length - 1 ? '重播' : '播放';\n    position(animate);\n  }\n  function pause() {\n    if (timer !== null) clearInterval(timer);\n    timer = null;\n  }\n  function seek(next) {\n    pause();\n    step = Math.max(0, Math.min(frames.length - 1, next));\n    draw();\n  }\n  play.addEventListener('click', () => {\n    if (timer !== null) { pause(); draw(); return; }\n    if (step === frames.length - 1) step = 0;\n    timer = setInterval(() => {\n      step++;\n      if (step === frames.length - 1) pause();\n      draw();\n    }, 2400);\n    draw();\n  });\n  byId('prev').addEventListener('click', () => seek(step - 1));\n  byId('next').addEventListener('click', () => seek(step + 1));\n  byId('reset').addEventListener('click', () => seek(0));\n  layers.forEach((node, i) => node.addEventListener('click', () => seek(i)));\n  byId('scenario').addEventListener('change', () => seek(0));\n  if ('ResizeObserver' in window) new ResizeObserver(() => position(false)).observe(list);\n  else window.addEventListener('resize', () => position(false));\n  draw(false);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}}</script>
<script>
  const docs = JSON.parse(document.getElementById('animation-documents').textContent);
  const keys = Object.keys(docs);
  const tab = key => document.getElementById('tab-' + key);
  const panel = key => document.getElementById('panel-' + key);
  const frames = new Map();
  const measured = new Map();
  const paths = Object.fromEntries(keys.map(key => [docs[key].file, key]));
  let active;

  function fit(frame) {
    const content = frame.contentDocument?.querySelector('main');
    if (content && !frame.parentElement.hidden) {
      const height = Math.ceil(content.getBoundingClientRect().height);
      if (height > 0) frame.style.height = height + 2 + 'px';
    }
  }

  function attach(key) {
    const frame = document.createElement('iframe');
    frame.title = docs[key].title + '动画';
    frame.addEventListener('load', () => {
      const content = frame.contentDocument;
      if (!content?.querySelector('main')) return;
      fit(frame);
      measured.get(key)?.disconnect();
      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(() => fit(frame));
        observer.observe(content.querySelector('main'));
        measured.set(key, observer);
      }
      content.addEventListener('click', event => {
        const link = event.target.closest('a[href]');
        if (!link) return;
        const destination = paths[link.getAttribute('href')];
        if (destination) {
          event.preventDefault();
          select(destination, true);
          tab(destination).focus();
        }
      });
      for (const link of content.querySelectorAll('a[href]')) {
        const href = link.getAttribute('href');
        if (!paths[href]) {
          link.target = '_blank';
          link.rel = 'noopener';
        }
      }
    });
    frame.srcdoc = docs[key].html;
    panel(key).append(frame);
    frames.set(key, frame);
    return frame;
  }

  function select(key, updateHash = false) {
    if (!keys.includes(key)) key = 'normal';
    if (active && active !== key) {
      const control = frames.get(active)?.contentDocument?.getElementById('play');
      if (control?.textContent === '暂停') control.click();
    }
    active = key;
    for (const item of keys) {
      const selected = item === key;
      tab(item).setAttribute('aria-selected', String(selected));
      tab(item).tabIndex = selected ? 0 : -1;
      panel(item).hidden = !selected;
    }
    const frame = frames.get(key) ?? attach(key);
    requestAnimationFrame(() => fit(frame));
    if (updateHash) history.replaceState(null, '', '#' + key);
  }

  for (const key of keys) {
    tab(key).addEventListener('click', () => select(key, true));
    tab(key).addEventListener('keydown', event => {
      const index = keys.indexOf(key);
      let next;
      if (event.key === 'ArrowRight') next = (index + 1) % keys.length;
      else if (event.key === 'ArrowLeft') next = (index + keys.length - 1) % keys.length;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = keys.length - 1;
      else return;
      event.preventDefault();
      select(keys[next], true);
      tab(keys[next]).focus();
    });
  }
  window.addEventListener('hashchange', () => select(location.hash.slice(1)));
  window.addEventListener('resize', () => fit(frames.get(active)));
  select(location.hash.slice(1));
</script>
</body>
</html>
